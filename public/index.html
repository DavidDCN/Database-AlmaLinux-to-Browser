<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Web to DB Emulation</title>
</head>
<body>
    <h2>Submit a Message to AlmaLinux PostgreSQL</h2>
    <input type="text" id="msgInput" placeholder="Type something...">
    <button onclick="sendData()">Save to DB</button>

    <h3>Saved Messages:</h3>
    <ul id="msgList"></ul>

    <script>
        async function fetchMessages() {
            const res = await fetch('/api/messages');
            const data = await res.json();
            const list = document.getElementById('msgList');
            list.innerHTML = '';
            data.forEach(item => {
                let li = document.createElement('li');
                li.textContent = `${item.content} (Saved at: ${item.created_at})`;
                list.appendChild(li);
            });
        }

        async function sendData() {
            const content = document.getElementById('msgInput').value;
            await fetch('/api/messages', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ message: content })
            });
            document.getElementById('msgInput').value = '';
            fetchMessages();
        }

        fetchMessages();
    </script>
</body>
</html>
